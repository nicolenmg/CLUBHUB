<!DOCTYPE html><!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
}

h1 {
  color: rgb(70, 193, 105);
  text-align: center;
  font-size: 5em;
} 
p {
  color: rgb(168, 9, 222);
  text-align: center;
  font-size: 1.8em;
  font-family: 'verdana';
  font-style: italic;
 font-weight: bold;
}
a {
  color: rgb(227, 225, 74);
  text-decoration: none;
}
section {
  background-color: rgba(193, 165, 202, 0.5);
  background-size: 20%;
  display: flow-root;
  width: 100vw;
  margin: 0 0 0 -5px;
}
section h1,
section p {
  text-align: left;
}
ul {
  list-style-type: none;
  margin: 0px;
  padding: 5px;
  width: 150px;
  background-color: #d1aeeb;
  outline-width: medium;
}

li a {
  display: block;
  color: black;
  padding: 10px 30px;
  text-decoration: none;
}

/* Change the link and background color on hover */
li a:hover {
  background-color: #9e50ba;
  color: white;
}
li a:hover:not(.active) {
  background-color: #a53ccb;
  color: white;
}
</style>
</head>
<body>
  <ul>
  <section><h1> Wey<a>Gey</a>Hey</h1><p>CLUBHUB</p></section>
  <li><a href="#home">Home</a></li>
  <li><a href="#club">Club</a></li>
  <li><a href="#Team">Team</a></li>
  <li><a href="#committee">Committee</a></li>
  <li><a href="#patrons">Patrons</a></li>
  <li><a href="#about">About</a></li>
</ul>

  

</body>
</html>
